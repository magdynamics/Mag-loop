name: validate

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest ships Node and Python 3, so setting them up explicitly
      # only adds marketplace actions this repository does not need.
      - name: Show toolchain
        run: node --version && python3 --version

      - name: Validate skill contracts
        run: node scripts/validate.mjs

      - name: Run verify-loop tests
        working-directory: tools/verify-loop
        run: python3 -m unittest discover -s tests

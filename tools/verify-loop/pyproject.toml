[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "magloop"
version = "0.1.0"
description = "A resumable, verification-gated agentic loop for coding work."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
magloop = "magloop.cli:main"

[tool.setuptools]
packages = ["magloop"]
